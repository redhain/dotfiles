# ============================================================
# 🖤 DARK BLACK/ASH AESTHETIC KITTY CONFIGURATION
# ============================================================

# ──────────────────────────────────────────────────────────
# 🖋️ TYPOGRAPHY & FONTS
# ──────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5

adjust_line_height  2
adjust_column_width 0

# ──────────────────────────────────────────────────────────
# 🌑 COLOR SCHEME - Deep Ash/Charcoal Black
# ──────────────────────────────────────────────────────────
# Core colors - deep blacks and soft ash grays
background #0a0a0c
foreground #c5c8d1

# Darker ash variations
# Black / Dark grays
color0   #0a0a0c
color8   #1a1c23

# Red - deep crimson
color1   #b87b6d
color9   #d48c7c

# Green - muted forest
color2   #7d8b6d
color10  #8f9e7d

# Yellow - dusty gold
color3   #b8a56d
color11  #ceba7d

# Blue - steel blue
color4   #6d86b8
color12  #7d98ce

# Magenta - dusty purple
color5   #9b7db8
color13  #ad8dce

# Cyan - muted teal
color6   #6da3b8
color14  #7db5ce

# White - ash gray
color7   #a8abb5
color15  #c5c8d1

# Selection colors - subtle ash
selection_background #1e2028
selection_foreground #e8eaf5

# ──────────────────────────────────────────────────────────
# ✨ VISUAL EFFECTS & TRANSPARENCY
# ──────────────────────────────────────────────────────────
# Deep black background with slight transparency
background_opacity 0.88

# Blur effect for depth
dynamic_background_opacity yes
background_blur       12

# Minimal window decorations
hide_window_decorations titlebar-only
window_padding_width   20
window_padding_height  15
window_margin_width    0
window_margin_height   0

# ──────────────────────────────────────────────────────────
# 🎯 CURSOR & SELECTION - Subtle glow
# ──────────────────────────────────────────────────────────
cursor_shape           block
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0

# Soft ash cursor
cursor                #9b9eae
cursor_text_color     #0a0a0c

# ──────────────────────────────────────────────────────────
# 📁 TAB BAR - Minimal dark ash
# ──────────────────────────────────────────────────────────
tab_bar_edge           top
tab_bar_style          custom
tab_bar_min_tabs       2
tab_switch_strategy    previous

# Active tab - subtle highlight
active_tab_foreground   #e8eaf5
active_tab_background   #1a1c23
active_tab_font_style   bold
active_tab_title_template  "   {title}  "

# Inactive tabs - deep ash
inactive_tab_foreground #565a6b
inactive_tab_background #0a0a0c
inactive_tab_font_style normal

# Tab separator - subtle divider
tab_separator          " "

# ──────────────────────────────────────────────────────────
# 📜 SCROLLBACK & PERFORMANCE
# ──────────────────────────────────────────────────────────
scrollback_lines       10000
scrollback_pager       less --chop-long-lines --RAW-CONTROL-CHARS
scrollback_pager_history_size 0

wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# ──────────────────────────────────────────────────────────
# 🔌 SHELL INTEGRATION
# ──────────────────────────────────────────────────────────
allow_remote_control yes
shell_integration enabled

# ──────────────────────────────────────────────────────────
# ⌨️ CUSTOM KEYBOARD SHORTCUTS
# ──────────────────────────────────────────────────────────
# Tab navigation
map ctrl+shift+right next_tab
map ctrl+shift+left  prev_tab
map ctrl+shift+t     new_tab
map ctrl+shift+q     close_tab

# Window splitting
map ctrl+shift+enter new_window
map ctrl+shift+h     neighboring_window left
map ctrl+shift+l     neighboring_window right
map ctrl+shift+k     neighboring_window up
map ctrl+shift+j     neighboring_window down

# Copy/Paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font size
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# ──────────────────────────────────────────────────────────
# 🖼️ ADVANCED FEATURES
# ──────────────────────────────────────────────────────────
image_protocol kitty
undercurl_style thin-sparse
mouse_hide_wait 2.0
focus_follows_mouse no

# ──────────────────────────────────────────────────────────
# 🚀 STARTUP COMMANDS
# ──────────────────────────────────────────────────────────
# Uncomment to start with tmux or custom session
# startup_session ~/.config/kitty/session.conf

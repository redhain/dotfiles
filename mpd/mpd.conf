# MPD Basic Configuration for Hyprland
# =====================================

# Directories
music_directory    "/home/ridu/Music"
playlist_directory "/home/ridu/.config/mpd/playlists"
db_file            "/home/ridu/.config/mpd/database"
log_file           "syslog"
pid_file           "/home/ridu/.config/mpd/pid"
state_file         "/home/ridu/.config/mpd/state"

# Music organization
auto_update    "yes"
auto_update_depth "3"

# Audio Output (ALSA - more reliable for now)
audio_output {
   type          "alsa"
   name          "ALSA Output"
   mixer_type    "software"
}

# Network settings
bind_to_address "127.0.0.1"
port "6600"

# Volume control
mixer_type "software"

# Filesystem settings
filesystem_charset "UTF-8"

